name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kryptonix_client
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kryptonix_client?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-change-me-0000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-change-me-0000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # pinned version from package.json's "packageManager" field, and
      # specifying both throws ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # `prisma migrate deploy` only applies *existing* migration SQL
      # files, and this repo has none yet — it was built in a sandbox
      # with no database network access, so `prisma migrate dev` (which
      # needs a live DB to diff against) could never be run to generate
      # one. `db push` syncs the schema straight onto the database
      # instead, which is exactly what CI (and any fresh clone, before a
      # real migration history exists) needs. Switch this to
      # `pnpm db:migrate:deploy` once someone has run `pnpm db:migrate`
      # against a real Postgres and committed the resulting
      # prisma/migrations directory.
      - name: Sync database schema (no migration history yet — see comment)
        run: pnpm db:push

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (packages/shared)
        run: pnpm --filter @kryptonix/shared test

      - name: Integration tests (apps/api, real Postgres)
        run: pnpm --filter @kryptonix/api test

      - name: Mobile typecheck
        run: pnpm --filter @kryptonix/mobile typecheck

      - name: Mobile bundle export (Hermes bytecode verification)
        run: pnpm --filter @kryptonix/mobile exec npx expo export --platform android
