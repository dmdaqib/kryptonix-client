name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kryptonix_client
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kryptonix_client?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-change-me-0000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-change-me-0000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # pinned version from package.json's "packageManager" field, and
      # specifying both throws ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: pnpm` here on purpose — that requires a committed
          # pnpm-lock.yaml to key the cache on, and this repo doesn't have
          # one yet (it was built in a sandbox with no registry access to
          # generate it — see PROGRESS.md). Once a lockfile exists from a
          # real `pnpm install`, add `cache: pnpm` back for faster runs.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (packages/shared)
        run: pnpm --filter @kryptonix/shared test

      - name: Build API
        run: pnpm --filter @kryptonix/api build

      - name: Mobile typecheck
        run: pnpm --filter @kryptonix/mobile typecheck
